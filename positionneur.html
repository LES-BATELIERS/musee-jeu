<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positionnement des bulles</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; font-family:Georgia,serif; color:#f0d080; }
h1 { text-align:center; padding:12px; font-size:14px; letter-spacing:2px; color:#c8a842; }
#wrap { position:relative; display:inline-block; }
#carte { width:100%; max-width:500px; display:block; }
.bulle {
  position:absolute; width:44px; height:44px; border-radius:50%;
  background:#1c1005; border:2.5px solid #5a3008;
  cursor:grab; display:flex; align-items:center; justify-content:center;
  font-size:18px; user-select:none; transform:translate(-50%,-50%);
  box-shadow:0 2px 8px rgba(0,0,0,0.6);
}
.bulle:active { cursor:grabbing; border-color:#c8a842; }
.label { text-align:center; font-size:9px; color:#c8a842; position:absolute; white-space:nowrap; transform:translateX(-50%); pointer-events:none; }
#coords { background:#1a1a1a; padding:12px; font-size:11px; line-height:2; border-top:1px solid #3a3530; }
#coords pre { color:#00cc44; font-family:monospace; white-space:pre-wrap; }
#btnCopy { margin:8px auto; display:block; padding:8px 20px; background:#3a1a00; color:#f0d080; border:1px solid #c8a842; border-radius:6px; cursor:pointer; font-family:Georgia,serif; }
</style>
</head>
<body>
<h1>✦ Glisse les bulles sur les personnages ✦</h1>
<div id="wrap">
  <img id="carte" src="img/carte-fond.jpg" draggable="false"/>
</div>
<div id="coords">
  <div style="color:#c8a842;margin-bottom:8px;">Coordonnées actuelles :</div>
  <pre id="output"></pre>
  <button id="btnCopy" onclick="copyCoords()">📋 Copier les coordonnées</button>
</div>

<script>
const bulles = [
  { id:'c0', emoji:'🗝️', label:'Guide',      x:72,  y:76  },
  { id:'c1', emoji:'🦜', label:'Perroquet',  x:248, y:118 },
  { id:'c2', emoji:'👑', label:'Joseph II',  x:80,  y:228 },
  { id:'c3', emoji:'🕐', label:'H.Salon',    x:270, y:268 },
  { id:'c4', emoji:'⏳', label:'H.Figée',    x:80,  y:336 },
  { id:'c5', emoji:'🐪', label:'Dromadaire', x:265, y:366 },
  { id:'c6', emoji:'🦄', label:'Licorne',    x:82,  y:433 },
  { id:'c7', emoji:'✨', label:'Lampe',      x:174, y:490 },
];

const wrap = document.getElementById('wrap');
const img  = document.getElementById('carte');
const vW = 360, vH = 540; // viewBox SVG

function toPercent(px, total) { return px / total; }
function fromPercent(pct, total) { return pct * total; }

let positions = bulles.map(b => ({ id:b.id, xPct: b.x/vW, yPct: b.y/vH }));

function createBulles() {
  bulles.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'bulle';
    div.id = 'bulle-'+b.id;
    div.textContent = b.emoji;
    div.title = b.label;

    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.id = 'label-'+b.id;
    lbl.textContent = b.label;

    wrap.appendChild(div);
    wrap.appendChild(lbl);

    updatePos(i);
    makeDraggable(div, i);
  });
  updateOutput();
}

function updatePos(i) {
  const iW = img.offsetWidth, iH = img.offsetHeight;
  const x = positions[i].xPct * iW;
  const y = positions[i].yPct * iH;
  const div = document.getElementById('bulle-'+bulles[i].id);
  const lbl = document.getElementById('label-'+bulles[i].id);
  div.style.left = x + 'px';
  div.style.top  = y + 'px';
  lbl.style.left = x + 'px';
  lbl.style.top  = (y + 26) + 'px';
}

function makeDraggable(el, i) {
  let startX, startY, startLeft, startTop;

  function onStart(ex, ey) {
    startX = ex; startY = ey;
    startLeft = positions[i].xPct * img.offsetWidth;
    startTop  = positions[i].yPct * img.offsetHeight;
    el.style.transition = 'none';
    el.style.zIndex = 99;
  }
  function onMove(ex, ey) {
    const dx = ex - startX, dy = ey - startY;
    const newX = Math.max(0, Math.min(img.offsetWidth,  startLeft + dx));
    const newY = Math.max(0, Math.min(img.offsetHeight, startTop  + dy));
    positions[i].xPct = newX / img.offsetWidth;
    positions[i].yPct = newY / img.offsetHeight;
    updatePos(i);
    updateOutput();
  }
  function onEnd() { el.style.zIndex = ''; }

  el.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu); });
  const mm = e => onMove(e.clientX, e.clientY);
  const mu = () => { onEnd(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };

  el.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  el.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  el.addEventListener('touchend',   onEnd);
}

function updateOutput() {
  const lines = bulles.map((b, i) => {
    const cx = Math.round(positions[i].xPct * vW);
    const cy = Math.round(positions[i].yPct * vH);
    return `${b.id} (${b.label}): cx="${cx}" cy="${cy}"`;
  });
  document.getElementById('output').textContent = lines.join('\n');
}

function copyCoords() {
  navigator.clipboard.writeText(document.getElementById('output').textContent).then(() => {
    document.getElementById('btnCopy').textContent = '✓ Copié !';
    setTimeout(() => document.getElementById('btnCopy').textContent = '📋 Copier les coordonnées', 2000);
  });
}

img.onload = createBulles;
if (img.complete) createBulles();
window.addEventListener('resize', () => bulles.forEach((_, i) => updatePos(i)));
</script>
</body>
</html>
